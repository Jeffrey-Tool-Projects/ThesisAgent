name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel previous in-progress runs for the same branch to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    strategy:
      # Don't abort the whole matrix when one cell fails — surfaces all
      # OS/version regressions in a single CI run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # The pip cache is restored on every ref but saved only from main.
      # Each entry is about 450 MB (PySide6, PyMuPDF) and a run cannot read
      # a sibling branch's caches, only its own ref's and main's. With
      # setup-python's `cache: pip`, dev, every PR merge ref and every
      # Dependabot branch saved a full set of six: on 2026-11-21 the store
      # held 17.3 GB against its 10 GB limit, and the 54 MB Nuitka
      # compiler cache of the release job was next in line for eviction.
      # main's set is readable from every ref, so one copy serves them all.
      # Keyed on the lock, which changes only with a dependency. After a
      # lock change, restore-keys brings back main's older set, so only
      # the changed wheels are downloaded.
      - name: Find the pip cache directory
        id: pip-dir
        shell: bash
        run: echo "dir=$(python -m pip cache dir)" >> "$GITHUB_OUTPUT"

      - name: Restore the pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pip-dir.outputs.dir }}
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('.github/requirements/ci.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install Qt system libraries (Linux)
        # PySide6 wheels ship most native deps but link to a handful
        # of system libs that ubuntu-latest doesn't preinstall —
        # libEGL.so.1 and the xcb / xkb stack are the load-time deps
        # pytest-qt trips on at "import QtGui" before any test runs.
        # Retried because this step failed on its own twice on 2026-11-19
        # (a695f30 on Python 3.14, 9dd2975 on Python 3.12) and passed on
        # the next push with no change: a mirror hiccup, not a missing
        # package. Acquire::Retries covers single downloads, the loop
        # covers a failed index update. A real error still fails after
        # the third try.
        if: runner.os == 'Linux'
        run: |
          for attempt in 1 2 3; do
            sudo apt-get -o Acquire::Retries=5 update && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libfontconfig1

      - name: Install dev extras (hash-locked, from .github/requirements/ci.in)
        # Every package comes from ci.txt at an exact version and hash:
        # the runtime dependencies, the [dev] extra and the build backend.
        # A new or compromised PyPI release reaches CI only through a
        # reviewed Dependabot PR that updates ci.txt. The project itself
        # is then installed with --no-deps (nothing unlocked comes in)
        # and --no-build-isolation (the locked setuptools builds it).
        # The command that regenerates ci.txt is in ci.in beside it.
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .  # NOSONAR builds the checked-out project itself with the locked backend, every dependency comes hash-locked from ci.txt

      - name: Save the pip cache (main only)
        # See "Restore the pip cache". Skipped when the exact key was
        # restored, since that entry already exists.
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.pip-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.pip-dir.outputs.dir }}
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: ruff lint
        run: python -m ruff check .

      - name: bandit security scan
        # The -c flag is mandatory — without it bandit ignores the
        # project's per-rule skip configuration in pyproject.toml.
        run: python -m bandit -c pyproject.toml -r thesisagents/

      - name: pytest
        # Hermetic fixtures only — no live HTTP. -X utf8 keeps Windows
        # console codec out of the picture for paper titles containing
        # accented or CJK characters. QT_QPA_PLATFORM=offscreen lets
        # PySide6 widgets instantiate without an X server on the
        # Ubuntu runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X utf8 -m pytest tests/ -q
